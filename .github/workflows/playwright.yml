name: Playwright Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Retries still run (so traces are captured), but a test that only passes
      # on retry fails the build instead of hiding a flaky test.
      - name: Run Playwright tests
        run: npx playwright test --fail-on-flaky-tests

      # The steps below run even when tests fail, so every run produces a report.
      - name: Write test summary
        if: ${{ !cancelled() }}
        run: node .github/scripts/test-summary.mjs test-results/results.json

      # HTML report: screenshots, videos and traces of failed tests are embedded.
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Raw screenshots/videos/traces as separate files, only when something failed.
      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-artifacts
          path: test-results/artifacts/
          retention-days: 14
